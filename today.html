<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Menu scuola di oggi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family:
        system-ui,
        -apple-system,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      margin: 0;
      padding: 20px;
      line-height: 1.35;
      background: #f6f6f6;
      color: #222;
    }

    .card {
      max-width: 720px;
      margin: 0 auto;
      background: white;
      border: 1px solid #e6e6e6;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    h1 {
      font-size: 22px;
      margin: 0 0 6px;
    }

    .sub {
      color: #555;
      margin: 0 0 14px;
    }

    ul {
      margin: 12px 0 20px;
      padding-left: 18px;
    }

    li {
      margin: 6px 0;
    }

    .weekly-title {
      margin-top: 22px;
      margin-bottom: 10px;
      padding-top: 18px;
      border-top: 1px solid #eee;
      font-size: 15px;
      font-weight: 700;
      color: #555;
    }

    .main-links {
      display: grid;
      gap: 10px;
    }

    .main-link {
      display: block;
      padding: 13px 14px;
      border: 1px solid #ddd;
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      background: #fafafa;
    }

    .main-link strong {
      display: block;
      margin-bottom: 3px;
      font-size: 16px;
    }

    .main-link span {
      display: block;
      color: #666;
      font-size: 13px;
      line-height: 1.4;
    }

    .btnrow {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
      justify-content: center;
    }

    .btn {
      display: inline-block;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      background: white;
    }

    .footer {
      max-width: 720px;
      margin: 18px auto 0;
      text-align: center;
      color: #999;
      font-size: 11px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>🍽️ Menu scuola di oggi</h1>

    <p
      class="sub"
      id="date"
    >
      📅 …
    </p>


    <!-- MENU SCOLASTICO -->

    <ul id="list"></ul>


    <!-- ACCESSO ALLA SETTIMANA -->

    <div class="weekly-title">
      Organizza anche le cene
    </div>


<div class="main-links">

  <a
    class="main-link"
    href="./week.html"
  >
    <strong>
      🍽️ Cene e lista della spesa
    </strong>

    <span>
      Guarda le cinque cene proposte in base
      ai pranzi scolastici e la lista degli ingredienti
      per la settimana.
    </span>
  </a>

</div>


    <!-- NAVIGAZIONE -->

    <div class="btnrow">



      <a
        class="btn"
        href="./"
      >
        🏠 Home
      </a>

    </div>

  </div>


  <div class="footer">
    🧪 Versione di prova ·
    Progetto sperimentale ideato da
    <strong>Egon Angeli</strong>
  </div>


<script>

  const WORKER_URL =
    "https://menu-push-c10.egon-angeli-info.workers.dev";


  async function loadMenu() {

    const params =
      new URLSearchParams(
        location.search
      );


    let date =
      params.get("date");


    let dishes = null;


    let source =
      params.get("source")
      ||
      "https://menuscuole.risto3cloud.it/menu";


    const dishesRaw =
      params.get("dishes");


    /*
     * ========================================
     * ARRIVO DALLA NOTIFICA
     * ========================================
     */

    if (dishesRaw) {

      try {

        dishes =
          JSON.parse(dishesRaw);

      }

      catch (e) {

        console.error(
          "Errore parse dishes dalla query:",
          e
        );

        dishes = [];
      }

    }


    /*
     * ========================================
     * APERTURA MANUALE
     * ========================================
     */

    else {

      try {

        const res =
          await fetch(
            WORKER_URL +
            "/menu-today?sourceId=c10"
          );


        if (res.ok) {

          const json =
            await res.json();


          if (
            json.ok &&
            json.menu
          ) {

            date =
              json.menu.date
              ||
              date;


            dishes =
              json.menu.dishes
              ||
              [];


            source =
              json.menu.source
              ||
              source;
          }

        }

        else {

          console.warn(
            "menu-today non disponibile:",
            res.status
          );
        }

      }

      catch (e) {

        console.error(
          "Errore nel recupero menu-today:",
          e
        );
      }

    }


    /*
     * ========================================
     * VALORI DI FALLBACK
     * ========================================
     */

    if (!date) {
      date = "Oggi";
    }


    if (!Array.isArray(dishes)) {
      dishes = [];
    }


    /*
     * ========================================
     * DATA
     * ========================================
     */

    const dateEl =
      document.getElementById(
        "date"
      );


    if (dateEl) {

      dateEl.textContent =
        "📅 " + date;
    }


    /*
     * ========================================
     * PIATTI
     * ========================================
     */

    const ul =
      document.getElementById(
        "list"
      );


    if (ul) {

      ul.innerHTML = "";


      if (!dishes.length) {

        const li =
          document.createElement(
            "li"
          );


        li.textContent =
          "Nessun piatto trovato";


        ul.appendChild(li);

      }

      else {

        dishes.forEach(
          (dish) => {

            const li =
              document.createElement(
                "li"
              );


            li.textContent =
              String(dish);


            ul.appendChild(li);

          }
        );

      }

    }




  }


  loadMenu();

</script>


</body>
</html>
