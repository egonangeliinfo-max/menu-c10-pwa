}

.dinner-label {

  </style>

<body>

  <div class="card">

    <h1>🍽️ Menu scuola di oggi</h1>

    <p

      id="date"
    >
      📅 …
    </p>


    <!-- MENU SCOLASTICO -->

    <ul id="list"></ul>

<!-- CENA DI OGGI -->

<section
  class="dinner-card"
  id="dinner-card"
  style="display:none;"
>

  <div class="dinner-label">
    🌙 STASERA
  </div>

  <div
    class="dinner-name"
    id="dinner-name"
  ></div>

  <div
    class="dinner-info"
    id="dinner-info"
  ></div>

</section>
    <!-- ACCESSO ALLA SETTIMANA -->

    <div class="weekly-title">
      Organizza anche le cene
    </div>


<div class="main-links">

  <a
    class="main-link"
    href="./week.html"
  >
    <strong>
      🍽️ Cene e lista della spesa
    </strong>

      ai pranzi scolastici e la lista degli ingredienti

</div>


    <!-- NAVIGAZIONE -->

    <div class="btnrow">



      <a

    </div>

  </div>


  <div class="footer">
    🧪 Versione di prova ·
    Progetto sperimentale ideato da
    <strong>Egon Angeli</strong>
  </div>


<script>

  const WORKER_URL =
    "https://menu-push-c10.egon-angeli-info.workers.dev";

function normalizeDateText(value) {
  return String(value || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}


async function loadDinner(date) {

  try {

    /*
     * Chiediamo al Worker il piano settimanale.
     *
     * Il Worker restituisce il piano "latest".
     * Cerchiamo poi il giorno che corrisponde
     * esattamente alla data del menu visualizzato.
     */

    const res =
      await fetch(
        WORKER_URL +
        "/weekly-plan?sourceId=c10"
      );

    if (!res.ok) {
      console.warn(
        "Piano settimanale non disponibile:",
        res.status
      );
      return;
    }


    const json =
      await res.json();


    if (
      !json.ok ||
      !json.plan ||
      !Array.isArray(json.plan.days)
    ) {
      return;
    }


    const targetDate =
      normalizeDateText(date);


    const day =
      json.plan.days.find(
        (item) =>
          normalizeDateText(item.date) ===
          targetDate
      );


    /*
     * Sicurezza:
     * se la data non coincide con nessun giorno
     * del piano non mostriamo alcuna cena.
     */
    if (
      !day ||
      !day.dinner
    ) {

      console.log(
        "Nessuna cena trovata per:",
        date
      );

      return;
    }


    const dinner =
      day.dinner;


    const card =
      document.getElementById(
        "dinner-card"
      );


    const name =
      document.getElementById(
        "dinner-name"
      );


    const info =
      document.getElementById(
        "dinner-info"
      );


    if (name) {
      name.textContent =
        dinner.name || "Cena proposta";
    }


    if (info) {

      const details = [];

      if (dinner.minutes) {
        details.push(
          `⏱️ ${dinner.minutes} min`
        );
      }

      if (dinner.protein) {
        details.push(
          `🍴 ${formatDinnerValue(
            dinner.protein
          )}`
        );
      }

      info.textContent =
        details.join(" · ");
    }


    if (card) {
      card.style.display = "block";
    }

  }

  catch (error) {

    console.error(
      "Errore recupero cena:",
      error
    );

  }
}


function formatDinnerValue(value) {

  return String(value || "")
    .replace(/_/g, " ")
    .replace(
      /\b\w/g,
      (letter) =>
        letter.toUpperCase()
    );
}
  async function loadMenu() {

    const params =
      new URLSearchParams(
        location.search
      );


    let date =
      params.get("date");


    let dishes = null;


    let source =
      params.get("source")
      ||
      "https://menuscuole.risto3cloud.it/menu";


    const dishesRaw =
      params.get("dishes");


    /*
     * ========================================
     * ARRIVO DALLA NOTIFICA
     * ========================================
     */

    if (dishesRaw) {

      try {

        dishes =
          JSON.parse(dishesRaw);

      }

      catch (e) {

        console.error(
          "Errore parse dishes dalla query:",
          e
        );

        dishes = [];
      }

    }


    /*
     * ========================================
     * APERTURA MANUALE
     * ========================================
     */

    else {

      try {

        const res =
          await fetch(
            WORKER_URL +
            "/menu-today?sourceId=c10"
          );


        if (res.ok) {

          const json =
            await res.json();


          if (
            json.ok &&
            json.menu
          ) {

            date =
              json.menu.date
              ||
              date;


            dishes =
              json.menu.dishes
              ||
              [];


            source =
              json.menu.source
              ||
              source;
          }

        }

        else {

          console.warn(
            "menu-today non disponibile:",
            res.status
          );
        }

      }

      catch (e) {

        console.error(
          "Errore nel recupero menu-today:",
          e
        );
      }

    }


    /*
     * ========================================
     * VALORI DI FALLBACK
     * ========================================
     */

    if (!date) {
      date = "Oggi";
    }


    if (!Array.isArray(dishes)) {
      dishes = [];
    }


    /*
     * ========================================
     * DATA
     * ========================================
     */

    const dateEl =
      document.getElementById(
        "date"
      );


    if (dateEl) {

      dateEl.textContent =
        "📅 " + date;
    }


    /*
     * ========================================
     * PIATTI
     * ========================================
     */

    const ul =
      document.getElementById(
        "list"
      );


    if (ul) {

      ul.innerHTML = "";


      if (!dishes.length) {

        const li =
          document.createElement(
            "li"
          );


        li.textContent =
          "Nessun piatto trovato";


        ul.appendChild(li);

      }

      else {

        dishes.forEach(
          (dish) => {

            const li =
              document.createElement(
                "li"
              );


            li.textContent =
              String(dish);


            ul.appendChild(li);

          }
        );

      }

    }

/*
 * ========================================
 * CENA DEL GIORNO
 * ========================================
 */

await loadDinner(date);


  }


  loadMenu();

</script>


</body>
</html>
