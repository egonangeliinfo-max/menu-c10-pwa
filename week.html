<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cene della settimana – C10</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      margin: 0;
      padding: 16px;
      line-height: 1.4;
      background: #f6f6f6;
      color: #222;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    .header {
      background: white;
      border: 1px solid #e6e6e6;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 21px;
      margin: 0 0 6px;
    }

    .week {
      color: #555;
      margin: 0;
    }

    .day {
      background: white;
      border: 1px solid #e6e6e6;
      border-radius: 16px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .day-title {
      font-weight: 700;
      font-size: 17px;
      padding: 13px 15px;
      border-bottom: 1px solid #eee;
    }

    .lunch {
      padding: 13px 15px;
      background: #fafafa;
    }

    .section-title {
      font-weight: 650;
      margin-bottom: 6px;
    }

    .lunch ul {
      margin: 5px 0 0;
      padding-left: 20px;
      color: #555;
      font-size: 14px;
    }

    .lunch li {
      margin: 2px 0;
    }

    .dinner {
      padding: 15px;
    }

    .dinner-name {
      font-size: 18px;
      font-weight: 750;
      margin: 5px 0 8px;
    }

    .details {
      color: #555;
      font-size: 14px;
    }

    .btnrow {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 18px 0;
    }

    .btn {
      display: inline-block;
      padding: 11px 14px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
    }

    .status {
      background: white;
      border: 1px solid #e6e6e6;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
    }
    .shopping-card {
  background: white;
  border: 1px solid #e6e6e6;
  border-radius: 16px;
  margin-bottom: 14px;
  overflow: hidden;
}

.shopping-toggle {
  width: 100%;
  border: 0;
  background: white;
  padding: 16px;
  text-align: left;
  font: inherit;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
}

.shopping-list {
  padding: 0 16px 16px;
}

.shopping-list.hidden {
  display: none;
}

.shopping-category {
  margin-top: 16px;
}

.shopping-category h3 {
  font-size: 16px;
  margin: 0 0 8px;
}

.shopping-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 7px 0;
  border-bottom: 1px solid #f0f0f0;
}

.shopping-item input {
  width: 19px;
  height: 19px;
  margin-top: 1px;
}

.shopping-item label {
  flex: 1;
}

.shopping-item.checked label {
  text-decoration: line-through;
  color: #888;
}
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>🍽️ Cene della settimana</h1>
      <p class="week" id="weekLabel">📅 Caricamento...</p>
    </div>

    <div id="content">
      <div class="status">
        Caricamento del piano settimanale...
      </div>
    </div>
<div class="shopping-card">
  <button
    class="shopping-toggle"
    id="shoppingToggle"
    type="button"
  >
    🛒 Mostra lista della spesa
  </button>

  <div
    id="shoppingList"
    class="shopping-list hidden"
  ></div>
</div>
    <div class="btnrow">
      <a class="btn" href="./">🏠 Torna alla home</a>

      <a
        class="btn"
        href="https://menuscuole.risto3cloud.it/menu"
        target="_blank"
        rel="noopener"
      >
        🏫 Menu Risto3
      </a>
    </div>

  </div>

<script>

const WORKER_URL =
  "https://menu-push-c10.egon-angeli-info.workers.dev";

function formatWeek(days) {
  if (!days || !days.length) {
    return "Settimana";
  }

  const first = days[0].date || "";
  const last = days[days.length - 1].date || "";

  const firstMatch =
    first.match(/(\d{1,2})\s+([a-zàèéìòù]+)\s+(\d{4})/i);

  const lastMatch =
    last.match(/(\d{1,2})\s+([a-zàèéìòù]+)\s+(\d{4})/i);

  if (!firstMatch || !lastMatch) {
    return first + " – " + last;
  }

  const firstDay = firstMatch[1];
  const firstMonth = firstMatch[2];

  const lastDay = lastMatch[1];
  const lastMonth = lastMatch[2];
  const year = lastMatch[3];

  if (
    firstMonth.toLowerCase() ===
    lastMonth.toLowerCase()
  ) {
    return `${firstDay}–${lastDay} ${lastMonth} ${year}`;
  }

  return `${firstDay} ${firstMonth} – ${lastDay} ${lastMonth} ${year}`;
}


function createDayCard(day) {

  const card =
    document.createElement("div");

  card.className = "day";


  /* DATA */

  const title =
    document.createElement("div");

  title.className = "day-title";
  title.textContent =
    day.date || "Giornata";

  card.appendChild(title);


  /* PRANZO */

  const lunch =
    document.createElement("div");

  lunch.className = "lunch";


  const lunchTitle =
    document.createElement("div");

  lunchTitle.className =
    "section-title";

  lunchTitle.textContent =
    "🏫 Pranzo a scuola";

  lunch.appendChild(lunchTitle);


  const ul =
    document.createElement("ul");

  const dishes =
    day.lunch?.dishes || [];

  if (!dishes.length) {

    const li =
      document.createElement("li");

    li.textContent =
      "Menu non disponibile";

    ul.appendChild(li);

  } else {

    dishes.forEach((dish) => {

      const li =
        document.createElement("li");

      li.textContent =
        String(dish);

      ul.appendChild(li);

    });

  }

  lunch.appendChild(ul);

  card.appendChild(lunch);


  /* CENA */

  const dinner =
    document.createElement("div");

  dinner.className = "dinner";


  const dinnerTitle =
    document.createElement("div");

  dinnerTitle.className =
    "section-title";

  dinnerTitle.textContent =
    "🌙 Cena consigliata";

  dinner.appendChild(dinnerTitle);


  const dinnerName =
    document.createElement("div");

  dinnerName.className =
    "dinner-name";

  dinnerName.textContent =
    day.dinner?.name ||
    "Cena non disponibile";

  dinner.appendChild(dinnerName);


  if (day.dinner) {

    const details =
      document.createElement("div");

    details.className =
      "details";

    const parts = [];

    if (day.dinner.minutes) {
      parts.push(
        `⏱️ ${day.dinner.minutes} min`
      );
    }

    if (day.dinner.protein) {

      const protein =
        String(day.dinner.protein)
          .replaceAll("_", " ");

      parts.push(
        `🥗 ${protein}`
      );
    }

    details.textContent =
      parts.join(" · ");

    dinner.appendChild(details);
  }


  card.appendChild(dinner);

  return card;
}

function formatQuantity(qty, unit) {
  if (unit === "g" && qty >= 1000) {
    const kg = qty / 1000;

    return (
      Number.isInteger(kg)
        ? kg
        : kg.toFixed(1).replace(".", ",")
    ) + " kg";
  }

  if (unit === "q.b.") {
    return "q.b.";
  }

  return `${qty} ${unit}`;
}


function normalizeShoppingList(shoppingList) {
  const normalized = {};

  for (const [category, items] of
    Object.entries(shoppingList || {})) {

    normalized[category] = {};

    for (const item of items || []) {

      let name = item.name
        .trim()
        .toLowerCase();

      /*
       * Unifichiamo alcune denominazioni equivalenti.
       */
      if (
        name === "verdura di stagione" ||
        name === "verdure di stagione"
      ) {
        name = "verdure di stagione";
      }

      const key =
        `${name}|${item.unit}`;

      if (!normalized[category][key]) {
        normalized[category][key] = {
          name,
          qty: 0,
          unit: item.unit
        };
      }

      normalized[category][key].qty +=
        item.qty;
    }
  }

  const result = {};

  for (const [category, items] of
    Object.entries(normalized)) {

    result[category] =
      Object.values(items);
  }

  return result;
}


function renderShoppingList(shoppingList) {

  const container =
    document.getElementById("shoppingList");

  if (!container) return;

  container.innerHTML = "";

  const normalized =
    normalizeShoppingList(shoppingList);

  const categoryInfo = {
    verdura: "🥦 Verdura",
    proteine: "🥩 Proteine",
    cereali: "🍝 Pane, pasta e cereali",
    latticini: "🧀 Latticini",
    dispensa: "🧂 Dispensa"
  };

  for (const category of [
    "verdura",
    "proteine",
    "cereali",
    "latticini",
    "dispensa"
  ]) {

    const items =
      normalized[category] || [];

    if (!items.length) continue;

    const section =
      document.createElement("div");

    section.className =
      "shopping-category";


    const heading =
      document.createElement("h3");

    heading.textContent =
      categoryInfo[category];

    section.appendChild(heading);


    items
      .sort((a, b) =>
        a.name.localeCompare(b.name, "it")
      )
      .forEach((item, index) => {

        const row =
          document.createElement("div");

        row.className =
          "shopping-item";


        const checkbox =
          document.createElement("input");

        checkbox.type = "checkbox";

        checkbox.id =
          `shopping-${category}-${index}`;


        const label =
          document.createElement("label");

        label.htmlFor =
          checkbox.id;

        const displayName =
          item.name.charAt(0).toUpperCase() +
          item.name.slice(1);

        label.textContent =
          `${displayName} — ${formatQuantity(
            item.qty,
            item.unit
          )}`;


        checkbox.addEventListener(
          "change",
          () => {
            row.classList.toggle(
              "checked",
              checkbox.checked
            );
          }
        );


        row.appendChild(checkbox);
        row.appendChild(label);

        section.appendChild(row);
      });


    container.appendChild(section);
  }
}
async function loadWeek() {

  const content =
    document.getElementById("content");

  const weekLabel =
    document.getElementById("weekLabel");

  try {

    const response =
      await fetch(
        WORKER_URL +
        "/weekly-plan?sourceId=c10"
      );

    if (!response.ok) {
      throw new Error(
        "Piano settimanale non disponibile"
      );
    }

    const json =
      await response.json();

    if (
      !json.ok ||
      !json.plan ||
      !Array.isArray(json.plan.days)
    ) {
      throw new Error(
        "Dati settimanali non validi"
      );
    }

    const plan =
      json.plan;
renderShoppingList(
  plan.shoppingList || {}
);

    weekLabel.textContent =
      "📅 " +
      formatWeek(plan.days);


    content.innerHTML = "";


    plan.days.forEach((day) => {

      content.appendChild(
        createDayCard(day)
      );

    });

  } catch (error) {

    console.error(error);

    content.innerHTML = "";

    const status =
      document.createElement("div");

    status.className =
      "status";

    status.textContent =
      "Il piano delle cene non è ancora disponibile.";

    content.appendChild(status);

    weekLabel.textContent =
      "📅 Settimana non disponibile";
  }
}
const shoppingToggle =
  document.getElementById("shoppingToggle");

const shoppingList =
  document.getElementById("shoppingList");

shoppingToggle?.addEventListener(
  "click",
  () => {

    const hidden =
      shoppingList.classList.toggle("hidden");

    shoppingToggle.textContent =
      hidden
        ? "🛒 Mostra lista della spesa"
        : "🛒 Nascondi lista della spesa";
  }
);

loadWeek();

</script>

</body>
</html>
