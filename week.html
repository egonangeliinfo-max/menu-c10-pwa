<body>

  <div class="container">

    <div class="header">
      <h1>🍽️ Cene della settimana</h1>
      <p class="week" id="weekLabel">📅 Caricamento...</p>

    <div class="week-switch">
  <a
    id="weekSwitchBtn"
    class="week-switch-btn"
    href="#"

    📅 Guarda la prossima settimana →
  </a>
</div>

</div>
    <div id="content">
      <div class="status">
        Caricamento del piano settimanale...
      </div>
    </div>
<div class="shopping-card"
   id="spesa"
  >
  <button
    class="shopping-toggle"
    id="shoppingToggle"
    type="button"
  >
    🛒 Mostra lista della spesa
  </button>

    id="shoppingList"
    class="shopping-list hidden"
  ></div>
</div>
    <div class="btnrow">
      <a class="btn" href="./">🏠 Torna alla home</a>

      <a
        class="btn"
        href="https://menuscuole.risto3cloud.it/menu"
        target="_blank"
        rel="noopener"
      >
        🏫 Menu Risto3
      </a>
    </div>

  </div>

<script>

const WORKER_URL =
  "https://menu-push-c10.egon-angeli-info.workers.dev";

function formatWeek(days) {
  if (!days || !days.length) {
    return "Settimana";
  }

  const first = days[0].date || "";
  const last = days[days.length - 1].date || "";

  const firstMatch =
    first.match(/(\d{1,2})\s+([a-zàèéìòù]+)\s+(\d{4})/i);

  const lastMatch =
    last.match(/(\d{1,2})\s+([a-zàèéìòù]+)\s+(\d{4})/i);

  if (!firstMatch || !lastMatch) {
    return first + " – " + last;
  }

  const firstDay = firstMatch[1];
  const firstMonth = firstMatch[2];

  const lastDay = lastMatch[1];
  const lastMonth = lastMatch[2];
  const year = lastMatch[3];

  if (
    firstMonth.toLowerCase() ===
    lastMonth.toLowerCase()
  ) {
    return `${firstDay}–${lastDay} ${lastMonth} ${year}`;
  }

  return `${firstDay} ${firstMonth} – ${lastDay} ${lastMonth} ${year}`;
}


function createDayCard(day) {

  const card =
    document.createElement("div");

  card.className = "day";


  /* DATA */

  const title =
    document.createElement("div");

  title.className = "day-title";
  title.textContent =
    day.date || "Giornata";

  card.appendChild(title);


  /* PRANZO */

  const lunch =
    document.createElement("div");

  lunch.className = "lunch";


  const lunchTitle =
    document.createElement("div");

  lunchTitle.className =
    "section-title";

  lunchTitle.textContent =
    "🏫 Pranzo a scuola";

  lunch.appendChild(lunchTitle);


  const ul =
    document.createElement("ul");

  const dishes =
    day.lunch?.dishes || [];

  if (!dishes.length) {

    const li =
      document.createElement("li");

    li.textContent =
      "Menu non disponibile";

    ul.appendChild(li);

  } else {

    dishes.forEach((dish) => {

      const li =
        document.createElement("li");

      li.textContent =
        String(dish);

      ul.appendChild(li);

    });

  }

  lunch.appendChild(ul);

  card.appendChild(lunch);


  /* CENA */

  const dinner =
    document.createElement("div");

  dinner.className = "dinner";


  const dinnerTitle =
    document.createElement("div");

  dinnerTitle.className =
    "section-title";

  dinnerTitle.textContent =
    "🌙 Cena consigliata";

  dinner.appendChild(dinnerTitle);


  const dinnerName =
    document.createElement("div");

  dinnerName.className =
    "dinner-name";

  dinnerName.textContent =
    day.dinner?.name ||
    "Cena non disponibile";

  dinner.appendChild(dinnerName);


  if (day.dinner) {

    const details =
      document.createElement("div");

    details.className =
      "details";

    const parts = [];

    if (day.dinner.minutes) {
      parts.push(
        `⏱️ ${day.dinner.minutes} min`
      );
    }

    if (day.dinner.protein) {

      const protein =
        String(day.dinner.protein)
          .replaceAll("_", " ");

      parts.push(
        `🥗 ${protein}`
      );
    }

    details.textContent =
      parts.join(" · ");

    dinner.appendChild(details);
  }


  card.appendChild(dinner);

  return card;
}

function formatQuantity(qty, unit) {
  if (unit === "g" && qty >= 1000) {
    const kg = qty / 1000;

    return (
      Number.isInteger(kg)
        ? kg
        : kg.toFixed(1).replace(".", ",")
    ) + " kg";
  }

  if (unit === "q.b.") {
    return "q.b.";
  }

  return `${qty} ${unit}`;
}


function normalizeShoppingList(shoppingList) {
  const normalized = {};

  for (const [category, items] of
    Object.entries(shoppingList || {})) {

    normalized[category] = {};

    for (const item of items || []) {

      let name = item.name
        .trim()
        .toLowerCase();

      /*
       * Unifichiamo alcune denominazioni equivalenti.
       */
      if (
        name === "verdura di stagione" ||
        name === "verdure di stagione"
      ) {
        name = "verdure di stagione";
      }

      const key =
        `${name}|${item.unit}`;

      if (!normalized[category][key]) {
        normalized[category][key] = {
          name,
          qty: 0,
          unit: item.unit
        };
      }

      normalized[category][key].qty +=
        item.qty;
    }
  }

  const result = {};

  for (const [category, items] of
    Object.entries(normalized)) {

    result[category] =
      Object.values(items);
  }

  return result;
}


function renderShoppingList(shoppingList, week) {
  const container =
    document.getElementById("shoppingList");

  if (!container) return;

  container.innerHTML = "";
const storageKey =
  `shopping-checked-${week}`;

let checkedItems = {};

try {
  checkedItems =
    JSON.parse(
      localStorage.getItem(storageKey)
    ) || {};
} catch {
  checkedItems = {};
}
  const note =
  document.createElement("div");

note.className = "shopping-note";

note.innerHTML = `
  👨‍👩‍👧‍👦 <strong>Quantità calcolate per 4 persone.</strong><br>
  Puoi aumentare o ridurre le quantità in proporzione
  al numero di persone.
`;

container.appendChild(note);
  const normalized =
    normalizeShoppingList(shoppingList);

  const categoryInfo = {
    verdura: "🥦 Verdura",
    proteine: "🥩 Proteine",
    cereali: "🍝 Pane, pasta e cereali",
    latticini: "🧀 Latticini",
    dispensa: "🧂 Dispensa"
  };

  for (const category of [
    "verdura",
    "proteine",
    "cereali",
    "latticini",
    "dispensa"
  ]) {

    const items =
      normalized[category] || [];

    if (!items.length) continue;

    const section =
      document.createElement("div");

    section.className =
      "shopping-category";


    const heading =
      document.createElement("h3");

    heading.textContent =
      categoryInfo[category];

    section.appendChild(heading);


    items
      .sort((a, b) =>
        a.name.localeCompare(b.name, "it")
      )
      .forEach((item, index) => {

        const row =
          document.createElement("div");

        row.className =
          "shopping-item";


        const checkbox =
          document.createElement("input");

        checkbox.type = "checkbox";

        checkbox.id =
          `shopping-${category}-${index}`;
const itemKey =
  `${category}|${item.name}|${item.unit}`;

checkbox.checked =
  checkedItems[itemKey] === true;

if (checkbox.checked) {
  row.classList.add("checked");
}

        const label =
          document.createElement("label");

        label.htmlFor =
          checkbox.id;

        const displayName =
          item.name.charAt(0).toUpperCase() +
          item.name.slice(1);

        label.textContent =
          `${displayName} — ${formatQuantity(
            item.qty,
            item.unit
          )}`;


       checkbox.addEventListener(
  "change",
  () => {

    row.classList.toggle(
      "checked",
      checkbox.checked
    );

    if (checkbox.checked) {
      checkedItems[itemKey] = true;
    } else {
      delete checkedItems[itemKey];
    }

    localStorage.setItem(
      storageKey,
      JSON.stringify(checkedItems)
    );
  }
);


        row.appendChild(checkbox);
        row.appendChild(label);

        section.appendChild(row);
      });


    container.appendChild(section);
  }
}
function dateToKey(date) {
  const year = date.getFullYear();
  const month =
    String(date.getMonth() + 1).padStart(2, "0");
  const day =
    String(date.getDate()).padStart(2, "0");

  return `${year}-${month}-${day}`;
}


function getMonday(offsetWeeks = 0) {

  const now = new Date();

  const date =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

  const day = date.getDay();

  const diff =
    day === 0
      ? -6
      : 1 - day;

  date.setDate(
    date.getDate() +
    diff +
    (offsetWeeks * 7)
  );

  return dateToKey(date);
}


function getRequestedWeek() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return (
    params.get("week") ||
    getMonday(0)
  );
}


function setupWeekNavigation(plan) {

  const currentWeek = getMonday(0);
  const nextWeek = getMonday(1);

  const button =
    document.getElementById("weekSwitchBtn");

  if (!button || !plan) return;

  // Ci basiamo sulla settimana realmente caricata dal Worker
  if (plan.week === currentWeek) {

    button.href =
      `./week.html?week=${nextWeek}`;

    button.textContent =
      "📅 Guarda la prossima settimana →";

  } else {

    button.href =
      `./week.html?week=${currentWeek}`;

    button.textContent =
      "← Torna a questa settimana 📅";

  }
}

  
loadWeek().then(() => {

  if (window.location.hash === "#spesa") {

    // Apre la lista
    setShoppingOpen(true);

    /*
     * Forziamo nuovamente l'ancora
     * dopo che il piano è stato costruito.
     */
    const target =
      document.getElementById("spesa");

    if (target) {

      setTimeout(() => {
        target.scrollIntoView({
          behavior: "auto",
          block: "start"
        });
      }, 300);

    }

  }

});
  
const shoppingToggle =
  document.getElementById("shoppingToggle");

const shoppingList =
  document.getElementById("shoppingList");


function setShoppingOpen(open) {

  if (!shoppingList || !shoppingToggle) {
    return;
  }

  shoppingList.classList.toggle(
    "hidden",
    !open
  );

  shoppingToggle.textContent =
    open
      ? "🛒 Nascondi lista della spesa"
      : "🛒 Mostra lista della spesa";
}


/*
 * Se arriviamo dalla Home tramite
 * week.html#spesa:
 * apre la lista e scorre fino alla spesa.
 */



/*
 * Apertura/chiusura manuale
 * della lista della spesa.
 */
shoppingToggle?.addEventListener(
  "click",
  () => {

    const isOpen =
      !shoppingList.classList.contains(
        "hidden"
      );

    setShoppingOpen(!isOpen);

  }
);


loadWeek().then(() => {

  if (window.location.hash === "#spesa") {

    setShoppingOpen(true);

    /*
     * Il piano è stato caricato.
     * Aspettiamo che il browser completi
     * il rendering e poi scorriamo.
     */
    requestAnimationFrame(() => {

      requestAnimationFrame(() => {

        const shoppingCard =
          document.querySelector(
            ".shopping-card"
          );

        if (shoppingCard) {

          shoppingCard.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });

        }

      });

    });

  }

});
</script>
