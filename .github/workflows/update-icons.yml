name: Aggiorna icone PWA
on:
  push:
    paths:
      - '.github/workflows/update-icons.yml'
      - 'icon-v2.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cairosvg
      - name: Genera icone da SVG V2
        run: |
          python - <<'PY'
          import cairosvg
          for name,size in [('icon-192.png',192),('icon-512.png',512),('apple-touch-icon.png',180)]:
              cairosvg.svg2png(url='icon-v2.svg',write_to=name,output_width=size,output_height=size)
          PY
      - name: Pubblica file aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna icone PNG dalla grafica V2"
            git push
          fi
